name: Foodgram CI/CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/foodgram-backend

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Django checks
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: 'True'
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

  build_and_push:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:latest

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Wait for SSH
        run: |
          echo "Waiting for ${{ secrets.HOST }}:22 ..."
          for i in $(seq 1 24); do
            if nc -zw5 "${{ secrets.HOST }}" 22; then
              echo "SSH is reachable"
              exit 0
            fi
            echo "Attempt ${i}/24: VM is not reachable on port 22"
            sleep 5
          done
          echo "::error::VM ${{ secrets.HOST }} is stopped or SSH port 22 is closed. Start r-backend-vm-1041981081 in Yandex Cloud / Practicum console, then re-run this job."
          exit 1
      - name: Deploy via git pull
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 90s
          command_timeout: 20m
          script: |
            set -e
            cd /home/ubuntu/foodgram
            git fetch origin main
            git reset --hard origin/main
            cd infra
            docker compose up -d --build
            docker compose restart nginx
            docker image prune -f
